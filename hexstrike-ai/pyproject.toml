[project]
name = "hexstrike-ai"
version = "6.0.0"
description = "HexStrike AI - Advanced Penetration Testing Framework (Modular Architecture)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "gh0st4n", email = "gh0st4n@example.com" }
]
keywords = ["security", "pentest", "mcp", "ai", "bug-bounty", "ctf"]

# ============================================================================
# CORE DEPENDENCIES
# ============================================================================
dependencies = [
    # Web framework
    "flask>=2.3.0,<4.0.0",
    # HTTP client
    "requests>=2.31.0,<3.0.0",
    # System utilities
    "psutil>=5.9.0,<6.0.0",
    # MCP framework
    "fastmcp>=0.2.0,<1.0.0",
    # HTML parsing
    "beautifulsoup4>=4.12.0,<5.0.0",
    # Browser automation
    "selenium>=4.15.0,<5.0.0",
    "webdriver-manager>=4.0.0,<5.0.0",
    # Async HTTP
    "aiohttp>=3.8.0,<4.0.0",
]

# ============================================================================
# OPTIONAL DEPENDENCIES (Development & Testing)
# ============================================================================
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

# Binary analysis (conditional, berat)
binary = [
    "pwntools>=4.10.0,<5.0.0",
    "angr>=9.2.0,<10.0.0",
    "bcrypt==4.0.1",
]

# Proxy & interception
proxy = [
    "mitmproxy>=9.0.0,<11.0.0",
]

# Full (semua optional deps)
full = [
    "hexstrike-ai[dev,binary,proxy]",
]

# ============================================================================
# SCRIPTS / ENTRY POINTS
# ============================================================================
[project.scripts]
hexstrike-server = "hexstrike_server:main"
hexstrike-mcp = "hexstrike_mcp:main"

# ============================================================================
# BUILD SYSTEM
# ============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hexstrike"]

# ============================================================================
# UV CONFIGURATION
# ============================================================================
[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "requests>=2.31.0",
]

# ============================================================================
# PYTEST CONFIGURATION
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--timeout=60",
]
markers = [
    "slow: tests yang butuh waktu lama",
    "integration: integration tests (butuh server running)",
    "e2e: end-to-end tests",
    "unit: unit tests",
]
timeout = 60
log_cli = true
log_cli_level = "INFO"

# ============================================================================
# RUFF (LINTER) CONFIGURATION
# ============================================================================
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line too long (biarkan fleksibel)

# ============================================================================
# COVERAGE CONFIGURATION
# ============================================================================
[tool.coverage.run]
source = ["hexstrike"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true